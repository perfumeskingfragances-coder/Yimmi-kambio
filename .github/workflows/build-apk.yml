name: Build Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Ensure Android platform exists and sync Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Verify Android SDK and accept licenses
        run: |
          if [ ! -d "$ANDROID_SDK_ROOT" ] && [ -d "$HOME/Android/Sdk" ]; then
            export ANDROID_SDK_ROOT="$HOME/Android/Sdk"
            export ANDROID_HOME="$HOME/Android/Sdk"
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_SDK_ROOT" || true
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT" -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          fi

      - name: Build and sign release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          STORE_PASS="${KEYSTORE_PASSWORD:-android123}"
          KEY_PASS="${KEY_PASSWORD:-$STORE_PASS}"
          ALIAS_NAME="${KEY_ALIAS:-yimmi-kambio}"

          if [ ! -f "release.jks" ]; then
            echo "Generando release.jks para firmar el APK..."
            keytool -genkeypair -v \
              -keystore release.jks \
              -alias "$ALIAS_NAME" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Yimmi Kambio, OU=App, O=Futuro Ahora, L=Cagua, ST=Aragua, C=VE"
          fi

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

          APK_DIR="app/build/outputs/apk/release"
          RAW_APK=$(find "$APK_DIR" -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "No se generó ningún APK en $APK_DIR"
            exit 1
          fi

          BUILD_TOOLS_DIR=$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          ALIGNED_APK="$APK_DIR/yimmi-kambio-aligned.apk"
          SIGNED_APK="$APK_DIR/yimmi-kambio-release-signed.apk"

          if [ -n "$BUILD_TOOLS_DIR" ] && [ -x "$BUILD_TOOLS_DIR/zipalign" ]; then
            "$BUILD_TOOLS_DIR/zipalign" -p -f 4 "$RAW_APK" "$ALIGNED_APK"
          else
            cp "$RAW_APK" "$ALIGNED_APK"
          fi

          if [ -n "$BUILD_TOOLS_DIR" ] && [ -x "$BUILD_TOOLS_DIR/apksigner" ]; then
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks ../release.jks \
              --ks-key-alias "$ALIAS_NAME" \
              --ks-pass "pass:$STORE_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --out "$SIGNED_APK" \
              "$ALIGNED_APK"
          fi

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yimmi-kambio-release-apk
          path: android/app/build/outputs/apk/release/*.apk
