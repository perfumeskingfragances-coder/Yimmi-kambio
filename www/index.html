            --theme-badge-text: #7e22ce;
            --theme-badge-dark-text: #f3e8ff;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            background:
                radial-gradient(circle at 12% 8%, var(--theme-ring), transparent 45%),
                radial-gradient(circle at 88% 92%, rgba(59, 130, 246, 0.16), transparent 48%),
                #e6ecf5;
            color: #090d16;
            transition: background 0.25s ease, color 0.25s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        html.dark, html.dark body {
            background:
                radial-gradient(circle at 15% 10%, var(--theme-ring), transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(59, 130, 246, 0.14), transparent 50%),
                #04060d;
            color: #f8fafc;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }

        .mobile-viewport {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            height: 100dvh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, #f9fbff 0%, #eef2f9 100%);
            box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.09), 0 25px 55px -20px rgba(15, 23, 42, 0.24);
        }
        html.dark .mobile-viewport {
            background: linear-gradient(180deg, #0c1120 0%, #070a13 100%);
            box-shadow: 0 0 0 1px var(--theme-ring), var(--theme-glow);
        }

        .logo-white-box {
            background-color: #ffffff !important;
        }

        .splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9998;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: #ffffff;
            color: #0f172a;
            opacity: 1;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }
        html.dark .splash-screen {
            background: #060811;
            color: #f8fafc;
        }
        .splash-screen.splash-hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-orbit-stage {
            position: relative;
            width: 124px;
            height: 124px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .splash-orbit-ring {
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            background: conic-gradient(from 0deg, transparent 0deg, var(--theme-secondary) 110deg, var(--theme-primary) 230deg, transparent 360deg);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
            animation: splashSpin 1.4s linear infinite;
        }
        .splash-core-card {
            position: relative;
            width: 96px;
            height: 96px;
            border-radius: 24px;
            padding: 5px;
            background: #ffffff;
            border: 1px solid var(--theme-ring);
            box-shadow: var(--theme-glow);
            overflow: hidden;
            animation: splashPulse 1.6s ease-in-out infinite;
        }
        .splash-core-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 19px;
            background-color: #ffffff !important;
        }
        .splash-scan-beam {
            position: absolute;
            left: 6%;
            right: 6%;
            height: 3px;
            border-radius: 9999px;
            background: linear-gradient(90deg, transparent, var(--theme-secondary), var(--theme-primary), transparent);
            box-shadow: 0 0 10px var(--theme-primary);
            animation: splashScan 1.5s ease-in-out infinite;
            pointer-events: none;
        }
        .splash-progress-track {
            width: 136px;
            height: 4px;
            border-radius: 9999px;
            background: rgba(148, 163, 184, 0.25);
            overflow: hidden;
        }
        .splash-progress-bar {
            width: 45%;
            height: 100%;
            border-radius: 9999px;
            background: linear-gradient(90deg, var(--theme-secondary), var(--theme-primary));
            animation: splashBarMove 1.2s ease-in-out infinite;
        }

        @keyframes splashSpin {
            to { transform: rotate(360deg); }
        }
        @keyframes splashPulse {
            0%, 100% { transform: scale(0.96); }
            50% { transform: scale(1.02); }
        }
        @keyframes splashScan {
            0%, 100% { top: 14%; opacity: 0.4; }
            50% { top: 82%; opacity: 1; }
        }
        @keyframes splashBarMove {
            0% { transform: translateX(-100%); width: 45%; }
            50% { width: 70%; }
            100% { transform: translateX(240%); width: 45%; }
        }

        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--theme-secondary), var(--theme-primary));
            border-radius: 9999px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(148, 163, 184, 0.26);
            box-shadow: 0 10px 24px -16px rgba(15, 23, 42, 0.16), 0 2px 6px -2px rgba(15, 23, 42, 0.04);
            color: #090d16;
        }
        html.dark .glass-panel {
            background: rgba(17, 23, 40, 0.92);
            backdrop-filter: blur(14px);
            border: 1px solid var(--theme-ring);
            box-shadow: 0 12px 26px -14px rgba(0, 0, 0, 0.78), inset 0 0 0 1px rgba(255, 255, 255, 0.03);
            color: #f1f5f9;
        }

        .field-box {
            background: #f2f5fa;
            border: 1px solid rgba(148, 163, 184, 0.30);
            color: #090d16;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
        }
        .field-box:focus-within {
            background: #ffffff;
            border-color: var(--theme-primary);
            box-shadow: 0 0 0 2px var(--theme-ring);
        }
        html.dark .field-box {
            background: #090d18;
            border: 1px solid rgba(255, 255, 255, 0.10);
            color: #f8fafc;
        }
        html.dark .field-box:focus-within {
            background: #0c1120;
            border-color: var(--theme-primary);
            box-shadow: var(--theme-glow);
        }

        .result-highlight-box {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.09) 0%, rgba(168, 85, 247, 0.14) 100%);
            border: 1px solid var(--theme-ring);
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }
        .result-highlight-box:focus-within {
            border-color: var(--theme-primary);
            box-shadow: 0 0 0 2px var(--theme-ring);
        }
        html.dark .result-highlight-box {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.16) 0%, rgba(168, 85, 247, 0.22) 100%);
            border: 1px solid var(--theme-ring);
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
        }

        .grad-action {
            background: linear-gradient(135deg, var(--theme-secondary) 0%, var(--theme-primary) 100%);
            box-shadow: var(--theme-glow);
            color: var(--theme-on-action);
        }

        .accent-text {
            color: var(--theme-badge-text);
            font-weight: 800;
        }
        html.dark .accent-text {
            color: var(--theme-badge-dark-text);
            font-weight: 800;
            text-shadow: 0 0 10px var(--theme-ring);
        }

        .badge-pill {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: var(--theme-badge-text);

            background: #0a0d16;
            border: 1px solid var(--theme-ring);
            color: var(--theme-badge-dark-text);
            box-shadow: var(--theme-glow);
        }

        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        function registrarTokenEnFirebase(token) {
            if (!token) {

            try {
                const safeKey = btoa(token).replace(/[^a-zA-Z0-9_-]/g, '').slice(-48) || ('tok_' + Date.now());

        function obtenerFechaEfectivaPorDefecto(ahora = new Date()) {
            const copia = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());
            const diaSemana = ahora.getDay();
            const hora = ahora.getHours();

            if (diaSemana === 5 && hora >= 20) {
                copia.setDate(copia.getDate() + 3);
            } else if (diaSemana === 6) {
                copia.setDate(copia.getDate() + 2);
            } else if (diaSemana === 0) {
                copia.setDate(copia.getDate() + 1);
            }

            return toIsoDayLocal(copia);
        }

        function parseDecimalInput(rawVal) {
            if (rawVal === undefined || rawVal === null) return NaN;
            let norm = String(rawVal).trim().replace(/\s+/g, '');
            if (/^\d{1,3}(\.\d{3})+(,\d{1,2})$/.test(norm)) {
                norm = norm.replace(/\./g, '').replace(',', '.');
            } else if (/^\d{1,3}(,\d{3})+(\.\d{1,2})$/.test(norm)) {
                norm = norm.replace(/,/g, '');
            } else if (norm.includes(',') && !norm.includes('.')) {
                norm = norm.replace(',', '.');
            } else if (norm.includes(',') && norm.includes('.')) {
                const lastComma = norm.lastIndexOf(',');
                const lastDot = norm.lastIndexOf('.');
                if (lastComma > lastDot) {
                    norm = norm.replace(/\./g, '').replace(',', '.');
                } else {
                    norm = norm.replace(/,/g, '');
                }
            }
            norm = norm.replace(/[^0-9.]/g, '');
            if (!norm || norm === '.') return NaN;
            return parseFloat(norm);
        }

        function parsearDatosPagoMovilPegados(texto) {
            if (!texto || typeof texto !== 'string') return null;
            const limpio = texto.trim();
            if (!limpio) return null;

            const telMatch = limpio.match(/(?:\+?58[\s-]*)?(0?4\d{2})[\s.-]*(\d{3})[\s.-]*(\d{4})|\b(0?4\d{9})\b/);
            const telefono = telMatch
                ? (telMatch[4]
                    ? (telMatch[4].startsWith('0') ? telMatch[4] : '0' + telMatch[4])
                    : ((telMatch[1].startsWith('0') ? telMatch[1] : '0' + telMatch[1]) + telMatch[2] + telMatch[3]))
                : '';

            const ciConLetraMatch = limpio.match(/\b([VEJGvejg])[\s.:-]*(\d{6,9})\b/);
            let documento = ciConLetraMatch ? `${ciConLetraMatch[1].toUpperCase()}-${ciConLetraMatch[2]}` : '';

            let bancoDetectado = '';
            const codMatch = limpio.match(/\b(0102|0104|0105|0108|0114|0115|0128|0134|0137|0138|0146|0151|0156|0157|0163|0166|0168|0169|0171|0172|0173|0174|0175|0177|0178|0191|0601)\b/);
            if (codMatch) {
                bancoDetectado = BANCOS_PM.find(b => b.startsWith(codMatch[1])) || '';
            }
            if (!bancoDetectado) {
                const lower = limpio.toLowerCase();
                for (const b of BANCOS_PM) {
                    const partes = b.split(' - ')[1] || '';
                    const palabrasClave = partes
                        .toLowerCase()
                        .replace(/\(.*?\)/g, '')
                        .split(/\s+/)
                        .filter(w => w.length >= 4 && !['banco', 'universal', 'crédito', 'credito'].includes(w));
                    if (palabrasClave.some(p => lower.includes(p))) {
                        bancoDetectado = b;
                        break;
                    }
                }
            }

            let textoSinTel = telefono && telMatch ? limpio.replace(telMatch[0], ' ') : limpio;
            if (ciConLetraMatch) {
                textoSinTel = textoSinTel.replace(ciConLetraMatch[0], ' ');
            }
            const textoSinCod = codMatch ? textoSinTel.replace(new RegExp(`\\b${codMatch[1]}\\b`, 'g'), ' ') : textoSinTel;

            if (!documento) {
                const ciEtiquetadoMatch = textoSinCod.match(/(?:c[eé]dula|ci|c\.i\.?|rif|doc(?:umento)?)\s*[:#=-]?\s*(\d{6,9})\b/i);
                if (ciEtiquetadoMatch) {
                    documento = `V-${ciEtiquetadoMatch[1]}`;
                    textoSinTel = textoSinTel.replace(ciEtiquetadoMatch[0], ' ');
                }
            }

            const textoLimpioParaCandidatos = documento && !ciConLetraMatch
                ? textoSinCod.replace(new RegExp(`\\b${documento.replace(/^V-/, '')}\\b`), ' ')
                : textoSinCod;

            let montoDivisa = '';
            const montoConEtiqueta = textoLimpioParaCandidatos.match(/(?:monto|total|bs\.?|ves|usd|\$|eur|€|usdt)\s*[:=]?\s*(\d{1,3}(?:[.,]\d{3})*(?:[.,]\d{1,2})|\d+(?:[.,]\d{1,2}))/i)
                || textoLimpioParaCandidatos.match(/(\d{1,3}(?:[.,]\d{3})*(?:[.,]\d{1,2})|\d+(?:[.,]\d{1,2}))\s*(?:bs\.?|ves|usd|\$|eur|€|usdt)/i);

            let montoConsumidoStr = '';
            if (montoConEtiqueta) {
                const num = parseMontoFlexibleTexto(montoConEtiqueta[1]);
                if (!isNaN(num)) {
                    montoConsumidoStr = montoConEtiqueta[1];
                    const esBs = /\b(bs\.?|ves)\b/i.test(montoConEtiqueta[0]);
                    if (esBs) {
                        const tasaRef = getTasaPorMoneda(window.state?.pmMoneda || 'usd') || 1;
                        montoDivisa = formatMontoInput(num / tasaRef);
                    } else {
                        montoDivisa = formatMontoInput(num);
                    }
                }
            }

            if (!documento) {
                const candidatosCedula = textoLimpioParaCandidatos.match(/\b\d{6,9}\b/g) || [];
                for (const cand of candidatosCedula) {
                    if (montoConsumidoStr && cand === montoConsumidoStr.replace(/[.,]/g, '')) continue;
                    if (/^0?4\d{9}$/.test(cand)) continue;
                    documento = `V-${cand}`;
                    break;
                }
            }

            if (!montoDivisa) {
                const textoSinCiNum = documento
                    ? textoLimpioParaCandidatos.replace(new RegExp(`\\b${documento.replace(/^V-/, '')}\\b`), ' ')
                    : textoLimpioParaCandidatos;
                const candidatos = textoSinCiNum.match(/\b\d{1,3}(?:[.,]\d{3})*(?:[.,]\d{1,2})|\b\d+(?:[.,]\d{1,2})\b/g) || [];
                for (let i = candidatos.length - 1; i >= 0; i--) {
                    const n = parseMontoFlexibleTexto(candidatos[i]);
                    if (!isNaN(n) && n > 0) {
                        montoDivisa = formatMontoInput(n);
                        break;
                    }
                }
            }

            return {
                banco: bancoDetectado,
                documento,
                telefono,
                montoDivisa,
                textoOriginal: limpio
            };
        }

        function interpretarMontoOCR(rawText, modoForzado = 'auto') {
            if (!rawText || typeof rawText !== 'string') return null;
            const txt = rawText.trim();
            const lower = txt.toLowerCase();

            const esBs = /\b(bs\.?|ves|bolivares|bolívares|bolivar|bolívar|bsf)\b/i.test(lower);
            const esUsd = /(\$|usd|dolares|dólares|dolar|dólar)\b/i.test(lower);

            const candidatos = txt.match(/\d{1,3}(?:[.,]\d{3})*(?:[.,]\d{1,2})|\d+(?:[.,]\d{1,2})/g) || [];
            let montoNum = NaN;

            for (const cand of candidatos) {
                const n = parseMontoFlexibleTexto(cand);
                if (!isNaN(n) && n > 0) {
                    montoNum = n;
                    break;
                }
            }

            if (isNaN(montoNum) || montoNum <= 0) return null;

            let monedaDetectada = 'usd';
            if (modoForzado === 'usd' || modoForzado === 'bs') {
                monedaDetectada = modoForzado;
            } else if (esBs && !esUsd) {
                monedaDetectada = 'bs';
            } else if (esUsd && !esBs) {
                monedaDetectada = 'usd';
            } else if (esBs && esUsd) {
                const idxBs = lower.search(/\b(bs\.?|ves|bolivares|bolívares|bolivar|bolívar|bsf)\b/i);
                const idxUsd = lower.search(/(\$|usd|dolares|dólares|dolar|dólar)\b/i);
                monedaDetectada = idxBs < idxUsd ? 'bs' : 'usd';
            } else {
                monedaDetectada = window.state?.filasInvertidas ? 'bs' : 'usd';
            }

            return { monto: montoNum, monedaDetectada };
        }

        function buscarRegistroPorFecha(monedaId, isoFecha) {
            if (!isoFecha || monedaId === 'custom') return null;
            const lista = getListaHistorialMoneda(monedaId);
            const targetDt = parseFechaToDate(isoFecha);
            const tDay = targetDt ? toIsoDayLocal(targetDt) : String(isoFecha).trim();

            for (const item of lista) {
                if (item.isoDay === tDay) {

            if (esFechaLunesPostViernes(tDay)) {

            return null;

        function formatearFechaLegible(isoStr) {
            const dt = parseFechaToDate(isoStr);
            if (!dt) return new Date().toLocaleDateString('es-VE');
            const dias = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            const diaNombre = dias[dt.getDay()] || '';
            const dd = String(dt.getDate()).padStart(2, '0');
            const mm = String(dt.getMonth() + 1).padStart(2, '0');
            return `${diaNombre} ${dd}/${mm}`;
        }

        function formatearFechaValorCompleta(isoStr) {
            const dt = parseFechaToDate(isoStr) || new Date();
            const diasLargos = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
            const diaNombre = diasLargos[dt.getDay()] || '';
            const dd = String(dt.getDate()).padStart(2, '0');
            const mm = String(dt.getMonth() + 1).padStart(2, '0');
            const aa = String(dt.getFullYear()).slice(-2);
            return `${diaNombre}, ${dd}/${mm}/${aa}`;
        }

        function parseFechaToDate(fechaStr) {
            if (fechaStr === undefined || fechaStr === null) return null;
            if (typeof fechaStr === 'number' && !isNaN(fechaStr)) {
                const ms = fechaStr < 1e12 ? fechaStr * 1000 : fechaStr;
                const dNum = new Date(ms);
                if (isNaN(dNum.getTime())) return null;
                return new Date(dNum.getFullYear(), dNum.getMonth(), dNum.getDate(), 12, 0, 0);
            }
            const clean = String(fechaStr).trim();
            if (!clean) return null;

            const isoMatch = clean.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
            if (isoMatch) {
                return new Date(Number(isoMatch[1]), Number(isoMatch[2]) - 1, Number(isoMatch[3]), 12, 0, 0);
            }
            const veMatch = clean.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{2,4})$/);
            if (veMatch) {
                const year = veMatch[3].length === 2 ? Number('20' + veMatch[3]) : Number(veMatch[3]);
                return new Date(year, Number(veMatch[2]) - 1, Number(veMatch[1]), 12, 0, 0);
            }
            const parsed = new Date(clean);
            if (isNaN(parsed.getTime())) return null;
            return new Date(parsed.getFullYear(), parsed.getMonth(), parsed.getDate(), 12, 0, 0);
        }

        function normalizarListaRegistros(rawList, monedaId = 'usd') {
            const diasCortos = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            if (!Array.isArray(rawList)) return [];
            const baseRef = HISTORIAL_BASE_CAPTURAS[monedaId] || HISTORIAL_BASE_CAPTURAS.usd;
            const totalItems = rawList.length;

            const porDia = new Map();

            rawList.forEach((item, idx) => {
                const valor = parseFloat(item?.valor ?? item?.tasa ?? item?.monto ?? item);
                if (isNaN(valor) || valor <= 0) return;

                let dt = parseFechaToDate(item?.fecha ?? item?.date ?? item?.dia);
                if (!dt && baseRef.length > 0) {
                    const offsetDesdeFinal = totalItems - 1 - idx;
                    const baseIdx = Math.max(0, baseRef.length - 1 - offsetDesdeFinal);
                    dt = parseFechaToDate(baseRef[baseIdx]?.fecha);
                }
                if (!dt) {
                    const offsetDesdeFinal = totalItems - 1 - idx;
                    dt = new Date(2026, 10, 20 - Math.max(0, offsetDesdeFinal), 12, 0, 0);
                }

                const dd = String(dt.getDate()).padStart(2, '0');
                const mm = String(dt.getMonth() + 1).padStart(2, '0');
                const isoDay = toIsoDayLocal(dt);
                const labelFecha = `${dd}/${mm}`;
                const etiquetaDia = `${diasCortos[dt.getDay()]} ${dd}/${mm}`;

                porDia.set(isoDay, {
                    ts: dt.getTime(),
                    isoDay,
                    labelFecha,
                    etiquetaDia,
                    valor: Number(valor.toFixed(2))
                });
            });

            return Array.from(porDia.values()).sort((a, b) => a.isoDay.localeCompare(b.isoDay));
        }

        function extraerHistorialDesdeSnapshot(rawData) {
            const resultado = { usd: [], eur: [], usdt: [] };
            if (!rawData || typeof rawData !== 'object') return resultado;

            const monedasKeys = ['usd', 'eur', 'usdt'];
            monedasKeys.forEach(mKey => {
                const nodoMoneda = rawData[mKey];
                if (nodoMoneda && typeof nodoMoneda === 'object') {
                    if (Array.isArray(nodoMoneda)) {
                        resultado[mKey] = normalizarListaRegistros(nodoMoneda, mKey);
                    } else {
                        const arr = Object.entries(nodoMoneda)
                            .filter(([k]) => k !== 'ultimaSincronizacion')
                            .map(([k, v]) => {
                                if (v && typeof v === 'object') {
                                    return { fecha: v.fecha || v.date || k, valor: v.valor ?? v.tasa ?? v.monto };
                                }
                                return { fecha: k, valor: v };
                            });
                        resultado[mKey] = normalizarListaRegistros(arr, mKey);
                    }
                }
            });

            if (resultado.usd.length === 0 && resultado.eur.length === 0 && resultado.usdt.length === 0) {
                Object.entries(rawData).forEach(([fechaKey, valPorMoneda]) => {
                    if (fechaKey !== 'ultimaSincronizacion' && valPorMoneda && typeof valPorMoneda === 'object') {
                        monedasKeys.forEach(mKey => {
                            if (valPorMoneda[mKey] !== undefined) {
                                const vItem = valPorMoneda[mKey];
                                const montoVal = typeof vItem === 'object' ? (vItem.valor ?? vItem.tasa ?? vItem.monto) : vItem;
                                resultado[mKey].push({ fecha: fechaKey, valor: montoVal });
                            }
                        });
                    }
                });
                resultado.usd = normalizarListaRegistros(resultado.usd, 'usd');
                resultado.eur = normalizarListaRegistros(resultado.eur, 'eur');
                resultado.usdt = normalizarListaRegistros(resultado.usdt, 'usdt');
            }

            return resultado;
        }

        function construirResumenCambioTasa(labelMoneda, valorAnterior, valorNuevo) {
            const diff = Number((valorNuevo - valorAnterior).toFixed(2));
            if (Math.abs(diff) < 0.005) return null;
            const pct = valorAnterior > 0 ? ((diff / valorAnterior) * 100) : 0;
            const subio = diff > 0;
            const signoDiff = subio ? '+' : '';
            const signoPct = pct >= 0 ? '+' : '';
            const diffStr = `${signoDiff}${formatBsComa(diff)} Bs`;
            const pctStr = `${signoPct}${pct.toFixed(2).replace('.', ',')}%`;
            const horaStr = new Date().toLocaleTimeString('es-VE', { hour: '2-digit', minute: '2-digit' });

            return {
                label: labelMoneda,
                subio,
                diffStr,
                pctStr,
                resumen: `${labelMoneda} ${subio ? 'subió' : 'bajó'} ${diffStr} (${pctStr})`,
                hora: horaStr
            };
        }

        function iniciarCicloOCR() {
            const ejecutarLectura = async () => {
                if (!window.state?.scannerActivo) return;
                const video = document.getElementById('scannerVideo');
                const canvas = document.getElementById('scannerCanvas');

                if (video && canvas && video.readyState >= 2 && !ocrBusy && typeof Tesseract !== 'undefined') {
                    ocrBusy = true;
                    try {
                        const vw = video.videoWidth || 640;
                        const vh = video.videoHeight || 480;
                        const cropW = Math.floor(vw * 0.78);
                        const cropH = Math.floor(vh * 0.34);
                        const sx = Math.floor((vw - cropW) / 2);
                        const sy = Math.floor((vh - cropH) / 2);

                        canvas.width = cropW;
                        canvas.height = cropH;
                        const ctx = canvas.getContext('2d', { willReadFrequently: true });
                        if (ctx) {
                            ctx.drawImage(video, sx, sy, cropW, cropH, 0, 0, cropW, cropH);

                            const imgData = ctx.getImageData(0, 0, cropW, cropH);
                            const data = imgData.data;
                            for (let i = 0; i < data.length; i += 4) {
                                const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                                const v = lum > 135 ? 255 : 0;
                                data[i] = v;
                                data[i + 1] = v;
                                data[i + 2] = v;
                            }
                            ctx.putImageData(imgData, 0, 0);

                            const res = await Tesseract.recognize(canvas, 'eng');
                            const textoLeido = (res?.data?.text || '').trim();
                            if (textoLeido) {
                                const parsed = interpretarMontoOCR(textoLeido, window.state.scannerModo);
                                if (parsed && window.state.scannerActivo) {
                                    aplicarMontoEscaneado(parsed);
                                    return;
                                }
                            }
                        }
                    } catch (e) {}
                    finally {
                        ocrBusy = false;
                    }
                }

                if (window.state?.scannerActivo) {
                    scannerTimerId = setTimeout(ejecutarLectura, 950);
                }
            };

            scannerTimerId = setTimeout(ejecutarLectura, 450);
        }

        function buildHistorySerie(monedaId, rango) {
            const baseActual = getTasaPorMoneda(monedaId);
            const diasRango = rango === '7d' ? 7 : rango === '3m' ? 90 : 30;
            const realesMoneda = getListaHistorialMoneda(monedaId);

            const maxTs = realesMoneda.reduce((acc, item) => Math.max(acc, item.ts || 0), 0);
            const referenciaMs = Math.max(maxTs || 0, Date.now());
            const limiteMs = referenciaMs - (diasRango * 24 * 60 * 60 * 1000);

            const filtradosReales = realesMoneda.filter(p => (p.ts === 0 ? true : p.ts >= limiteMs));
            const serieAsc = filtradosReales.length > 0 ? filtradosReales : realesMoneda;
            const esDatoReal = Boolean(window.state?.historialSincronizado) || serieAsc.length > 0;

            const registrosDesc = calcularVariacionesSobreLista(realesMoneda);
            const registrosRangoDesc = calcularVariacionesSobreLista(serieAsc);

            const valores = serieAsc.map(x => x.valor);
            const minVal = valores.length > 0 ? Math.min(...valores) : baseActual;
            const maxVal = valores.length > 0 ? Math.max(...valores) : baseActual;
            const promVal = valores.length > 0 ? (valores.reduce((acc, v) => acc + v, 0) / valores.length) : baseActual;
            const primero = valores[0] || baseActual;
            const actualMostrar = baseActual;
            const varRangoPct = primero > 0 ? (((actualMostrar - primero) / primero) * 100) : 0;

            return {
                actual: actualMostrar,
                minVal,
                promVal,
                maxVal,
                varRangoPct,
                serieAsc,
                registrosDesc,
                registrosRangoDesc,
                esDatoReal
            };
        }

            const banco = (pegado && pegado.banco) || (cuenta && cuenta.banco) || '';
            const documento = (pegado && pegado.documento) || (cuenta && cuenta.documento) || '';
            const telefono = (pegado && pegado.telefono) || (cuenta && cuenta.telefono) || '';

            if (!banco && !documento && !telefono) {
                return 'Pega datos de Pago Móvil o agrega una cuenta primero.';
            }

            const num = parseDecimalInput(s.pmMontoDivisa);
            const tasa = getTasaPorMoneda(s.pmMoneda);
            const bsVal = !isNaN(num) && num > 0 ? formatBsComa(num * tasa) : '0,00';

            return `Pago Móvil\nBanco: ${banco || '—'}\nDocumento: ${documento || '—'}\nTeléfono: ${telefono || '—'}\nMonto a pagar: Bs. ${bsVal}`;
        }

        function calcularDesgloseVuelto() {
            const s = window.state;
            const monedas = getMonedasMeta();
            const meta = monedas[s.monedaActiva] || monedas.usd;
            const tasa = getTasaActiva();
            const totalACobrar = parseDecimalInput(s.montoCobroVuelto);
            const recibido = parseDecimalInput(s.montoRecibidoExt);

            if (isNaN(recibido) || recibido <= 0) {
                return {
                    activo: false,
                    esFalta: false,
                    esExacto: false,
                    diffDivisa: 0,
                    diffBs: 0,
                    etiqueta: 'Vuelto estimado',
                    textoDivisa: `${meta.simbolo} 0,00`,
                    textoBs: 'Bs. 0,00'
                };
            }

            const cobrarVal = isNaN(totalACobrar) ? 0 : totalACobrar;
            const diff = Number((recibido - cobrarVal).toFixed(2));
            const absDiff = Math.abs(diff);
            const bsDiff = absDiff * tasa;
            const esFalta = diff < -0.004;
            const esExacto = Math.abs(diff) <= 0.004;

            return {
                activo: true,
                esFalta,
                esExacto,
                diffDivisa: absDiff,
                diffBs: bsDiff,
                etiqueta: esExacto ? 'Pago exacto' : (esFalta ? 'Falta por cobrar' : 'Vuelto a entregar'),
                textoDivisa: `${meta.simbolo} ${formatMontoInput(absDiff)}`,
                textoBs: `Bs. ${formatBsComa(bsDiff)}`
            };
        }

        window.activarNotificacionesPush = async function() {
            if (window.state.activandoNotificaciones) return;
            if (typeof window === 'undefined' || !('Notification' in window)) {
                window.showToast?.('Notificaciones no soportadas en este dispositivo', 'error');
                return;
            }
            window.state.activandoNotificaciones = true;
            window.render();

            try {
                const permiso = await Notification.requestPermission();
                if (permiso !== 'granted') {
                    window.state.notificacionesActivas = false;
                    storageSet(NOTIF_ACTIVA_KEY, '0');
                    window.showToast?.('Permiso de notificaciones no concedido', 'error');
                    return;
                }

                window.state.notificacionesActivas = true;
                storageSet(NOTIF_ACTIVA_KEY, '1');

                if ('serviceWorker' in navigator && window.location && window.location.protocol.startsWith('http')) {
                    let swReg = null;
                    try {
                        swReg = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
                    } catch (err) {
                        window.showToast?.('Aviso SW: ' + (err?.code || err?.message || 'no registrado'), 'error');
                    }

                    if (messagingInstance && swReg && VAPID_PUBLIC_KEY) {
                        try {
                            const token = await getToken(messagingInstance, {
                                vapidKey: VAPID_PUBLIC_KEY,
                                serviceWorkerRegistration: swReg
                            });
                            if (token) {
                                window.state.fcmToken = token;
                                storageSet(FCM_TOKEN_KEY, token);
                                registrarTokenEnFirebase(token);
                            } else {
                                window.showToast?.('No se generó el token de notificaciones', 'error');
                            }
                        } catch (err) {
                            window.showToast?.('Aviso FCM: ' + (err?.code || err?.message || 'revisa SW y VAPID'), 'error');
                        }
                    }

                    if (swReg && typeof swReg.showNotification === 'function') {
                        try {
                            await swReg.showNotification('Yimmi Kambio', {
                                body: 'Notificaciones activadas. Te avisaremos cuando cambien las tasas.',
                                icon: LOGO_OFICIAL_URL,
                                badge: LOGO_OFICIAL_URL,
                                tag: 'yimmi-kambio-activada'
                            });
                        } catch (e) {}
                    }
                }
                window.showToast?.('Notificaciones activadas en Yimmi Kambio', 'success');
            } catch (e) {
                window.showToast?.('Error al activar notificaciones: ' + (e?.message || e), 'error');

                window.render();

            const bgClass = type === 'success'
                ? 'grad-action border-black/15 dark:border-white/20'

            toast.className = `${bgClass} px-4 py-3 rounded-2xl shadow-xl border text-xs font-bold flex items-center gap-2.5 transform translate-x-full transition-all duration-300 pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'} text-sm"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-x-full'), 50);
            setTimeout(() => {
                toast.classList.add('translate-x-full');
                setTimeout(() => {
                    try { toast.remove(); } catch (e) {}

        function copiarFallbackTexto(texto) {
            try {
                const ta = document.createElement('textarea');
                ta.value = texto;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                window.showToast?.('Copiado: ' + texto, 'success');
            } catch (e) {
                window.showToast?.('No se pudo copiar', 'error');
            }
        }

            const texto = String(val);
            if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
                navigator.clipboard.writeText(texto)
                    .then(() => window.showToast?.('Copiado: ' + texto, 'success'))
                    .catch(() => copiarFallbackTexto(texto));
            } else {
                copiarFallbackTexto(texto);
            }
        };

                    window.copiarTexto(texto);

        };

            const tasa = getTasaActiva();
            const extNum = parseDecimalInput(s.montoExt);
            const bsNum = parseDecimalInput(s.montoBs);

            const valExt = !isNaN(extNum) ? extNum : (!isNaN(bsNum) ? bsNum / tasa : 0);
            const valBs = !isNaN(bsNum) ? bsNum : (valExt * tasa);

            const simboloDivisa = meta.simbolo === 'USDT' ? 'USDT ' : `${meta.simbolo} `;
            const lineaMonto = `${simboloDivisa}${formatMontoInput(valExt)} = ${formatBsComa(valBs)} Bs.`;
            const lineaTasa = `Tasa ${meta.nombre}: 1${meta.simbolo === 'USDT' ? ' USDT' : meta.simbolo} = Bs. ${formatBsComa(tasa)}`;
            const lineaFecha = `Fecha valor: ${formatearFechaValorCompleta(s.fechaSeleccionada)}`;

            const mensaje = `${lineaMonto}\n\n${lineaTasa}\n\n${lineaFecha}`;
            window.compartirTexto(mensaje);

                window.state.montoBs = '';
                if (bsEl && document.activeElement?.id !== 'calcBsInput') bsEl.value = '';

            const calcBsNum = numExt * tasa;

            if (!fechaStr) return;
            window.state.fechaSeleccionada = fechaStr;
            window.state.fechaElegidaManualmente = fechaStr !== obtenerFechaEfectivaPorDefecto(new Date());
            recalcularDesdeEstadoActual();
            window.render();
            const reg = buscarRegistroPorFecha(window.state.monedaActiva, fechaStr);
            if (reg) {
                window.showToast?.(`Tasa ${formatearFechaLegible(fechaStr)}: ${formatBsComa(reg.valor)} Bs.`, 'success');
            }
        };

        window.compartirResumen = function() {
            const s = window.state;
            const texto = `Yimmi Kambio | Dólar BCV: ${formatBsComa(s.tasaBcv)} Bs. | Euro BCV: ${formatBsComa(s.tasaEuroBcv)} Bs. | USDT: ${formatBsComa(s.tasaUsdt)} Bs. | ${s.tasaPersNombre || 'Tasa Pers.'}: ${formatBsComa(s.tasaPersonalizada)} Bs.`;
            window.compartirTexto(texto);
        };

        window.toggleEscaner = async function() {
            if (window.state.scannerActivo) {
                stopScannerStream();
                window.render();
                return;
            }
            if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
                window.showToast?.('Cámara no disponible en este dispositivo', 'error');
                return;
            }
            try {
                scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                window.state.scannerActivo = true;
                window.state.scannerEstadoTexto = 'Leyendo monto en $ o Bs...';
                window.render();

                setTimeout(() => {
                    const video = document.getElementById('scannerVideo');
                    if (video && scannerStream) {
                        video.srcObject = scannerStream;
                        video.setAttribute('playsinline', '');
                        video.setAttribute('muted', '');
                        video.muted = true;
                        video.play().catch(() => {});
                    }
                    iniciarCicloOCR();
                }, 80);
            } catch (err) {
                stopScannerStream();
                window.showToast?.('No se pudo activar la cámara', 'error');
            }
        };

        window.toggleGraficaTasas = function() {
            window.state.mostrarGrafica = !window.state.mostrarGrafica;
            window.render();
            if (window.state.mostrarGrafica) {
                setTimeout(renderRatesChart, 80);
            }
        };

        window.setHistorialMoneda = function(monedaId) {
            if (!['usd', 'eur', 'usdt'].includes(monedaId)) return;
            window.state.historialMoneda = monedaId;
            window.render();
            setTimeout(renderHistoryChart, 60);
        };

        window.setHistorialRango = function(rango) {
            window.state.historialRango = rango;
            window.state.historialFechaFiltro = '';
            window.render();
            setTimeout(renderHistoryChart, 60);
        };

        window.setHistorialFechaFiltro = function(fechaStr) {
            window.state.historialFechaFiltro = fechaStr || '';
            window.render();
            setTimeout(renderHistoryChart, 60);
        };

        window.toggleFormGuardado = function() {
            window.state.mostrarFormGuardado = !window.state.mostrarFormGuardado;
            window.render();
        };

        window.agregarGuardado = function(e) {
            e.preventDefault();
            const titulo = (document.getElementById('guardadoTitulo')?.value || '').trim();
            const subtitulo = (document.getElementById('guardadoSubtitulo')?.value || '').trim();
            const moneda = document.getElementById('guardadoMoneda')?.value || 'usd';
            const monto = parseDecimalInput(document.getElementById('guardadoMonto')?.value || '0');
            if (!titulo || isNaN(monto) || monto <= 0) {
                window.showToast?.('Ingresa un nombre y un monto válido', 'error');
                return;
            }
            window.state.guardados.unshift({
                id: 'g_' + Date.now(),
                titulo,
                subtitulo,
                moneda,
                monto
            });
            persistGuardados();
            window.state.mostrarFormGuardado = false;
            window.showToast?.('Cálculo guardado', 'success');
            window.render();
        };

        window.eliminarGuardado = function(id) {
            window.state.guardados = window.state.guardados.filter(item => item.id !== id);
            persistGuardados();
            window.showToast?.('Eliminado de guardados', 'success');
            window.render();
        };

        window.seleccionarCuentaPM = function(id) {
            window.state.cuentaActivaId = id;
            window.state.pmDatosPegados = null;
            window.render();
        };

        window.abrirFormCuentaPM = function(id = null) {
            window.state.mostrarFormCuentaPM = true;
            window.state.editandoCuentaId = id;
            window.render();
        };

        window.cerrarFormCuentaPM = function() {
            window.state.mostrarFormCuentaPM = false;
            window.state.editandoCuentaId = null;
            window.render();
        };

        window.guardarCuentaPM = function(e) {
            e.preventDefault();
            const banco = (document.getElementById('pmBancoInput')?.value || '').trim();
            const documento = (document.getElementById('pmDocumentoInput')?.value || '').trim().toUpperCase();
            const telefono = (document.getElementById('pmTelefonoInput')?.value || '').trim();
            if (!banco || !documento || !telefono) {
                window.showToast?.('Selecciona el banco y completa documento y teléfono', 'error');
                return;
            }

            if (window.state.editandoCuentaId) {
                window.state.cuentasPM = window.state.cuentasPM.map(c =>
                    c.id === window.state.editandoCuentaId ? { ...c, banco, documento, telefono } : c
                );
                window.showToast?.('Cuenta de Pago Móvil actualizada', 'success');
            } else {
                const nueva = { id: 'pm_' + Date.now(), banco, documento, telefono };
                window.state.cuentasPM.push(nueva);
                window.state.cuentaActivaId = nueva.id;
                window.showToast?.('Cuenta de Pago Móvil añadida', 'success');
            }

            persistCuentasPM();
            window.state.mostrarFormCuentaPM = false;
            window.state.editandoCuentaId = null;
            window.state.pmDatosPegados = null;
            window.render();
        };

        window.setPmMoneda = function(monedaId) {
            const monedas = getMonedasMeta();
            if (!monedas[monedaId]) return;
            window.state.pmMoneda = monedaId;
            window.render();
        };

        window.onPmMontoChange = function(val) {
            const cleanText = sanitizeDecimalText(val);
            window.state.pmMontoDivisa = cleanText;
            const pmInputEl = document.getElementById('pmMontoInput');
            if (pmInputEl && pmInputEl.value !== cleanText) {
                pmInputEl.value = cleanText;
            }
            const num = parseDecimalInput(cleanText);
            const tasa = getTasaPorMoneda(window.state.pmMoneda);
            const totalBs = !isNaN(num) && num > 0 ? formatBsComa(num * tasa) : '0,00';
            const el = document.getElementById('pmMontoTotalBs');
            if (el) el.innerText = 'Bs. ' + totalBs;
        };

        window.copiarPagoMovil = function() {
            window.copiarTexto(getPagoMovilResumenTexto());
        };

        window.compartirPagoMovil = function() {
            const texto = getPagoMovilResumenTexto();
            const s = window.state;
            const cuenta = s.cuentasPM.find(c => c.id === s.cuentaActivaId) || s.cuentasPM[0] || null;
            const tieneAlgo = Boolean(s.pmDatosPegados && (s.pmDatosPegados.banco || s.pmDatosPegados.documento || s.pmDatosPegados.telefono)) || Boolean(cuenta);
            if (!tieneAlgo) {
                window.showToast?.(texto, 'error');
                return;
            }
            window.compartirTexto(texto);
        };

        window.render = function() {
            const appDiv = document.getElementById('app');
            if (!appDiv || !window.state) return;
            try {
                const v = window.state.view || 'calculadora';

                let bodyHtml = '';
                if (v === 'monedas') bodyHtml = window.renderMonedasView();
                else if (v === 'tasas') bodyHtml = window.renderTasasView();
                else if (v === 'tasasBcvPanel') bodyHtml = window.renderTasasBcvPanelView();
                else if (v === 'tasasUsdtPanel') bodyHtml = window.renderTasasUsdtPanelView();
                else if (v === 'guardados') bodyHtml = window.renderGuardadosView();
                else if (v === 'pagoMovil') bodyHtml = window.renderPagoMovilView();
                else if (v === 'historial') bodyHtml = window.renderHistorialView();
                else bodyHtml = window.renderCalculadoraView();

                appDiv.innerHTML = renderTopBar() + renderOfflineBanner() + bodyHtml + renderBottomNav(v) + renderMenuHamburguesaDrawer();
            } catch (e) {}
        };

        function initFirebaseListeners() {
            try {
                onValue(ref(db, 'config'), (snapshot) => {
                    const val = snapshot.val();
                    if (val && aplicarConfigSnapshot(val, true)) {
                        window.render();
                        if (window.state.view === 'tasas' && window.state.mostrarGrafica) {
                            setTimeout(renderRatesChart, 60);
                        }
                        if (window.state.view === 'historial') {
                            setTimeout(renderHistoryChart, 60);
                        }
                    }
                }, () => {});

                onValue(ref(db, 'historialTasas'), (snapshot) => {
                    const rawHist = snapshot.exists() ? snapshot.val() : {};
                    const extraido = extraerHistorialDesdeSnapshot(rawHist);

                    window.state.historialFirebase = extraido;
                    window.state.historialSincronizado = true;
                    marcarHistorialSincronizado();
                    saveCachedHistorial(extraido);
                    recalcularDesdeEstadoActual();
                    window.render();
                    if (window.state.view === 'historial') {
                        setTimeout(renderHistoryChart, 60);
                    }
                }, () => {});
            } catch (e) {}
        }

        function ocultarSplashTras3Segundos() {
            const splash = document.getElementById('splash-screen');
            if (!splash) return;
            setTimeout(() => {
                splash.classList.add('splash-hide');
                setTimeout(() => {
                    try { splash.remove(); } catch (e) {}
                }, 360);
            }, 2650);
        }

        window.addEventListener('online', () => {
            window.state.sinConexion = false;
            window.showToast?.('Conexión restablecida', 'success');
            window.render();
            if (window.state.view === 'historial') setTimeout(renderHistoryChart, 60);
        });

        window.addEventListener('offline', () => {
            window.state.sinConexion = true;
            window.showToast?.('Sin conexión: usando última tasa guardada', 'error');
            window.render();
            if (window.state.view === 'historial') setTimeout(renderHistoryChart, 60);
        });

        window.addEventListener('beforeunload', () => {
            stopScannerStream();
        });

        window.addEventListener('DOMContentLoaded', async () => {
            const savedThemeId = storageGet('yimmi_kambio_color_theme') || storageGet('kambio_yimmi_color_theme') || 'neon-purpura';
            const savedMode = storageGet('yimmi_kambio_mode') || storageGet('kambio_yimmi_mode');
            window.state.themeId = savedThemeId;
            applyThemePalette(savedThemeId);

            if (savedMode === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }

            recalcularDesdeEstadoActual();
            initFirebaseListeners();
            window.render();
            if (window.state.view === 'historial') {
                setTimeout(renderHistoryChart, 80);
            }
            ocultarSplashTras3Segundos();

            if (window.state.notificacionesActivas && typeof window !== 'undefined' && 'Notification' in window && Notification.permission === 'granted' && 'serviceWorker' in navigator && window.location && window.location.protocol.startsWith('http')) {
                try {
                    const swReg = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
                    if (messagingInstance && swReg && VAPID_PUBLIC_KEY) {
                        const token = await getToken(messagingInstance, {
                            vapidKey: VAPID_PUBLIC_KEY,
                            serviceWorkerRegistration: swReg
                        });
                        if (token) {
                            window.state.fcmToken = token;
                            storageSet(FCM_TOKEN_KEY, token);
                            registrarTokenEnFirebase(token);
                        }
                    }
                } catch (e) {}
            }
        });
    </script>
</body>
</html>
